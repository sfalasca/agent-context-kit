name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Quick pass (how-tos/run-tests.md step 1): host-only tests across the three
  # supported OSes and the min/max supported Python versions. Container-gated
  # tests report `skipped` here — that's expected.
  host-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Same PyYAML pin as the Containerfile; used only by test_skill_frontmatter.py.
      - run: python -m pip install pyyaml==6.0.2
      - run: python -m unittest discover -s tests -v

  # Full suite (how-tos/run-tests.md step 2): builds the pinned checks image and
  # runs everything, including the network-touching `npx skills add` tests that
  # only run inside the container. Gated on the quick pass per the
  # hierarchical-verification directive (cheapest first, stop at first failure).
  container-tests:
    needs: host-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/dev test
